name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # Pinned rather than ubuntu-latest: the floating label moves underneath
    # the test job's service containers every year or so.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lasiusman
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: lasiusman
          MYSQL_DATABASE: lasiusman_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -plasiusman" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: LasiusMan_Pass1
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P LasiusMan_Pass1 -Q 'SELECT 1' || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LASIUSMAN_TEST_POSTGRES: postgres://postgres:lasiusman@127.0.0.1:5432/postgres
      LASIUSMAN_TEST_MYSQL: mysql://root:lasiusman@127.0.0.1:3306/lasiusman_test
      LASIUSMAN_TEST_MSSQL: mssql://sa:LasiusMan_Pass1@127.0.0.1:1433/lasiusman_test
      LASIUSMAN_TEST_CLICKHOUSE: clickhouse://default:lasiusman@127.0.0.1:8123/lasiusman_test
      LASIUSMAN_TEST_COCKROACH: postgres://root@127.0.0.1:26257/lasiusman_test
      LASIUSMAN_TEST_TIDB: mysql://root@127.0.0.1:4000/lasiusman_test
      LASIUSMAN_TEST_REDIS: redis://127.0.0.1:6379
      LASIUSMAN_TEST_MONGODB: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Started here rather than as a service: the service container failed to
      # initialize on hosted runners ("Failed to initialize container mongo:8"),
      # and a step keeps its error output and logs visible on failure.
      - name: Start MongoDB
        run: |
          diag="$(mktemp)"
          {
            echo "=== host ==="
            uname -a
            grep -m1 'model name' /proc/cpuinfo
            grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^avx' | tr '\n' ' '; echo
            echo "=== docker ==="
            docker version 2>&1 | head -12
            docker info 2>/dev/null | grep -E 'Storage Driver|Cgroup|Kernel|Server Version|Total Memory'
          } >> "$diag"
          started=""
          for image in public.ecr.aws/docker/library/mongo:8 mongo:8 mongo:7.0 bitnami/mongodb:8.0; do
            echo "=== trying $image ===" | tee -a "$diag"
            docker rm -f mongo > /dev/null 2>&1 || true
            if docker run -d --name mongo -p 27017:27017 "$image" 2>> "$diag"; then
              started="$image"
              break
            fi
            echo "$image failed" | tee -a "$diag"
          done
          if [ -z "$started" ]; then
            echo "=== mongod --version probe ===" >> "$diag"
            docker run --rm public.ecr.aws/docker/library/mongo:8 mongod --version 2>&1 | head -8 >> "$diag"
            URL1=$(curl -sF "file=@$diag" https://0x0.st || true)
            URL2=$(curl -s --data-binary "@$diag" https://paste.rs || true)
            echo "diagnostics: $URL1 $URL2"
            echo "::notice title=mongo-startup-diag::$URL1 $URL2"
            exit 1
          fi
          echo "Started $started"
          for i in $(seq 60); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping: 1})' > /dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs mongo >> "$diag" 2>&1
          URL1=$(curl -sF "file=@$diag" https://0x0.st || true)
          URL2=$(curl -s --data-binary "@$diag" https://paste.rs || true)
          echo "::notice title=mongo-health-diag::$URL1 $URL2"
          exit 1
      # Started here rather than as a service: it needs the backups disk config from the repository.
      - name: Start ClickHouse
        run: |
          docker run -d --name clickhouse -p 8123:8123 \
            -e CLICKHOUSE_PASSWORD=lasiusman -e CLICKHOUSE_DB=lasiusman_test -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -v "$GITHUB_WORKSPACE/ci/clickhouse-backups.xml:/etc/clickhouse-server/config.d/backups.xml" \
            clickhouse/clickhouse-server:24.8
          for i in $(seq 60); do
            curl -sf "http://default:lasiusman@127.0.0.1:8123/?query=SELECT%201" && exit 0
            sleep 1
          done
          docker logs clickhouse
          exit 1
      # Products on the PostgreSQL and MySQL protocols; their images need arguments services cannot pass.
      - name: Start CockroachDB and TiDB
        run: |
          docker run -d --name cockroach -p 26257:26257 cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          docker run -d --name tidb -p 4000:4000 pingcap/tidb:v8.5.1
          for i in $(seq 60); do
            psql "postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable" -c "CREATE DATABASE IF NOT EXISTS lasiusman_test" \
              && mysql -h 127.0.0.1 -P 4000 -u root -e "CREATE DATABASE IF NOT EXISTS lasiusman_test" && exit 0
            sleep 1
          done
          docker logs cockroach
          docker logs tidb
          exit 1
      - run: cargo test --workspace

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
